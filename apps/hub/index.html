<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Office Mini Bubble World</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='16'%20fill='%23cfe9ff'/%3E%3Cg%20stroke='%233b2f2f'%20stroke-width='3.5'%20stroke-linejoin='round'%3E%3Ccircle%20cx='19'%20cy='17'%20r='8'%20fill='%23ffb3c7'/%3E%3Ccircle%20cx='45'%20cy='17'%20r='8'%20fill='%23ffb3c7'/%3E%3Ccircle%20cx='32'%20cy='37'%20r='22'%20fill='%23fffdf7'/%3E%3C/g%3E%3Ccircle%20cx='24'%20cy='36'%20r='3.4'%20fill='%233b2f2f'/%3E%3Ccircle%20cx='40'%20cy='36'%20r='3.4'%20fill='%233b2f2f'/%3E%3Cellipse%20cx='17.5'%20cy='44'%20rx='4.5'%20ry='3'%20fill='%23ffa3b5'/%3E%3Cellipse%20cx='46.5'%20cy='44'%20rx='4.5'%20ry='3'%20fill='%23ffa3b5'/%3E%3Cpath%20d='M28%2043q4%204%208%200'%20fill='none'%20stroke='%233b2f2f'%20stroke-width='2.8'%20stroke-linecap='round'/%3E%3Cellipse%20cx='22'%20cy='27'%20rx='4'%20ry='2.4'%20transform='rotate(-35%2022%2027)'%20fill='%23fff'%20opacity='.9'/%3E%3C/svg%3E">

<link rel="stylesheet" href="/shared/theme.css">
<style>
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.top { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; pointer-events: none; }
.top > * { pointer-events: auto; }
.title { padding: 4px 14px; font-weight: 900; font-size: 15px; border-width: 2px; }
.chip { cursor: pointer; padding: 2px 12px; font-size: 12px; font-weight: 700; border-width: 2px; border-radius: 999px; }
.pad { position: fixed; bottom: max(18px, env(safe-area-inset-bottom)); left: 22px; display: none; pointer-events: none; }
body.touch .pad { display: block; }
.stick { width: 140px; height: 140px; border-radius: 50%; border: 3px solid var(--ink); background: color-mix(in srgb, var(--paper) 70%, transparent); position: relative; pointer-events: auto; touch-action: none; }
.knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: var(--pink); border: 3px solid var(--ink); }
.keys { position: fixed; bottom: 12px; left: 12px; font-size: 12px; padding: 6px 12px; }
body.touch .keys { display: none; }
.zone { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translate(-50%, 140%); width: min(340px, calc(100% - 24px)); padding: 14px 16px; text-align: center; transition: transform .22s; z-index: 5; }
body.touch .zone { bottom: max(176px, calc(env(safe-area-inset-bottom) + 160px)); left: auto; right: 12px; transform: translate(0, 300%); width: min(250px, calc(100% - 190px)); padding: 10px 12px; }
.zone.show { transform: translate(-50%, 0); }
body.touch .zone.show { transform: translate(0, 0); }
.zone h2 { margin: 0; font-size: 20px; font-weight: 900; }
.zone p { margin: 2px 0 8px; font-size: 12.5px; color: var(--ink-soft); }
.zone .btn { display: block; width: 100%; margin-top: 6px; padding: 9px; font-size: 16px; font-weight: 900; }
.zone .btn[disabled] { opacity: .5; cursor: default; }
.zstat { font-size: 14px; font-weight: 900; margin: -2px 0 6px; }
.zstat:empty { display: none; }
.zone small { display: block; margin-top: 6px; font-size: 11.5px; color: var(--ink-soft); }
.who { position: fixed; top: calc(max(10px, env(safe-area-inset-top)) + 44px); right: 10px; width: min(200px, calc(100% - 20px)); max-height: 45vh; overflow: auto; padding: 6px 10px; border-width: 2px; border-radius: 14px; font-size: 13px; z-index: 4; }
.who[hidden] { display: none; }
.who div { display: flex; align-items: center; gap: 6px; padding: 3px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small.play { color: #e0557a; font-weight: 900; }
.who-tip { position: fixed; z-index: 7; width: 148px; padding: 8px 8px 10px; text-align: center; pointer-events: none; }
.who-tip[hidden] { display: none; }
.who-tip .slot { width: 132px; height: 132px; margin: 0 auto; border-radius: 50%; background: radial-gradient(circle at 50% 62%, var(--chip) 0 55%, transparent 70%); }
.who-tip b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who-tip small { display: block; font-size: 12px; color: var(--ink-soft); }
.who i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink); flex: none; }
.who small { color: var(--ink-soft); }
.board { position: fixed; left: 14px; top: calc(max(10px, env(safe-area-inset-top)) + 56px); transform: translate(-130%, 0); width: min(460px, calc(100% - 28px)); max-height: calc(100% - 150px); overflow: auto; padding: 16px 20px; z-index: 6; transition: transform .22s; }
.board.show { transform: translate(0, 0); }
body.touch .board { top: auto; bottom: max(176px, calc(env(safe-area-inset-bottom) + 160px)); left: auto; right: 12px; width: min(300px, calc(100% - 190px)); max-height: 42%; transform: translate(0, 300%); }
body.touch .board.show { transform: translate(0, 0); }
.board h2 { margin: 0; font-size: 26px; font-weight: 900; text-align: center; }
.board p { margin: 4px 0 10px; font-size: 14px; color: var(--ink-soft); text-align: center; }
.board ol { list-style: none; margin: 0; padding: 0; font-size: 17px; }
.board li { display: flex; justify-content: space-between; gap: 8px; padding: 7px 4px; border-bottom: 1px dashed var(--line); }
.board li:last-child { border: 0; }
.board li b { font-variant-numeric: tabular-nums; }
.board li span small { color: var(--ink-soft); margin-left: 6px; }
.board .tabs { display: flex; gap: 6px; justify-content: center; margin: 10px 0 6px; }
.board .tabs button { flex: 1; min-width: 0; padding: 7px 4px; font: inherit; font-size: 15px; font-weight: 700; color: var(--ink-soft); background: transparent; border: 1.5px solid var(--line); border-radius: 999px; cursor: pointer; }
.board .tabs button.on { color: var(--ink); background: var(--chip); border-color: var(--ink); }
.board h3 { margin: 10px 0 2px; font-size: 17px; font-weight: 900; }
.board .subtabs { display: flex; gap: 6px; justify-content: center; margin: 4px 0 8px; }
.board .subtabs button { padding: 4px 18px; font: inherit; font-size: 14px; font-weight: 700; color: var(--ink-soft); background: transparent; border: 1.5px solid var(--line); border-radius: 999px; cursor: pointer; }
.board .subtabs button.on { color: var(--ink); background: var(--chip); border-color: var(--ink); }
.board h3:first-child { margin-top: 0; }
.board .ver { text-align: center; font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.board .news { list-style: none; margin: 4px 0 0; padding: 0; font-size: 15px; }
.board .news > li { display: block; padding: 8px 4px; border-bottom: 1px dashed var(--line); }
.board .news > li:last-child { border: 0; }
.board .news b { display: block; font-size: 15px; margin-bottom: 2px; }
.board .news em { font-style: normal; font-size: 12px; font-weight: 900; padding: 0 7px; margin-right: 6px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--chip); }
.board .news p { margin: 3px 0; text-align: left; font-size: 14px; color: var(--ink); line-height: 1.45; }
.toast { position: fixed; left: 50%; top: calc(max(10px, env(safe-area-inset-top)) + 46px); transform: translate(-50%, 0); font-size: 14px; font-weight: 900; padding: 4px 16px; border-width: 2px; opacity: 0; pointer-events: none; transition: opacity .2s; white-space: nowrap; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="top">
  <div class="title box">Office Mini Bubble World</div>
  <div style="display:flex;gap:8px;align-items:center"><span class="chip box" id="online">單機</span><button class="btn" id="acctBtn">登入</button><button class="btn" id="avatarBtn">外觀</button></div>
</div>
<div class="pad"><div class="stick" id="stick"><div class="knob" id="knob"></div></div></div>
<div class="keys box"><b>WASD / 方向鍵</b> 移動，走進房間開玩，左下地墊看總積分，右下地墊看布告欄</div>
<div class="zone box" id="zone">
  <h2 id="zTitle"></h2><p id="zInfo"></p><div class="zstat" id="zStat"></div>
  <button class="btn primary" id="zOnline">加入對戰</button>
  <button class="btn" id="zSolo">單人</button>
  <small id="zNote"></small>
</div>
<div class="who box" id="who" hidden></div>
<div class="who-tip box" id="whoTip" hidden><div class="slot" id="tipSlot"></div><b id="tipName"></b><small id="tipLook"></small></div>
<div class="board box" id="board"><h2 id="boardTitle">總積分榜</h2><div class="tabs" id="boardTabs"><button data-tab="total" class="on">總積分</button><button data-tab="kart">賽車</button><button data-tab="bubble">泡泡島</button><button data-tab="artillery">砲戰</button><button data-tab="run">跑跑</button><button data-tab="survive">倖存者</button></div><p id="boardNote">連線對戰才計分，每場依名次給 5、3、2、1 分</p><div id="boardGames" hidden></div><ol id="boardList"><li>載入中…</li></ol></div>
<div class="board box" id="notice"><h2>布告欄</h2><p>目前版本</p><div class="ver" id="noticeVer">載入中…</div><h3>更新資訊</h3><ul class="news" id="noticeNews"></ul></div>
<div class="toast box" id="toast"></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { toon, G, boxOutline, makeCritter, animateCritter, addNameTag } from '/shared/three-kit.js';
import { ITEM_ART, GAME_ART, badgeFrame, INK } from '/shared/draw.js';
import { loadAppearance, openAvatarPicker, createCritterPreview, EARS, EYES } from '/shared/avatar.js';
import { watchUpdates } from '/shared/update.js';
watchUpdates(); // 有新版本時在畫面上方提醒重新整理
import { identity, openLogin, captureLogin, LOGIN_ERRORS } from '/shared/session.js';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const W = 18, H = 20; // 大廳大小（格），與 apps/worker/worker.js 的 LOBBY 一致
const SPEED = 4.2;

/* ---------- Telegram ---------- */
const TG = window.Telegram?.WebApp, inTelegram = !!(TG && TG.initData);
if (inTelegram) { try { TG.ready(); TG.expand(); TG.disableVerticalSwipes?.(); } catch {} if (TG.colorScheme) document.documentElement.dataset.theme = TG.colorScheme; }

/* ---------- 房間（每款遊戲一間）。新增遊戲：加一筆，並在 deploy/build.mjs 的 GAMES 加同一個 id ---------- */
const ROOMS = [
  { id: 'bubble', title: '泡泡碰碰島', blurb: '放水球、炸箱子、撿道具，撐到最後的小傢伙獲勝', color: '#5ab8ff', x0: .8, x1: 4.8, y0: .8, y1: 4.6, path: '/bubble/', art(x) { x.save(); x.translate(-12, 4); x.scale(.9, .9); ITEM_ART.bomb(x); x.restore(); x.save(); x.translate(42, 26); x.scale(.7, .7); ITEM_ART.power(x); x.restore(); } },
  { id: 'kart', title: '泡泡賽車', blurb: '道具賽或競速賽，3 圈漂移衝線，2–4 人連線', color: '#ff8fab', x0: 7, x1: 11, y0: .8, y1: 4.6, path: '/kart/', art(x) { GAME_ART.kart(x); } },
  { id: 'artillery', title: '泡泡砲戰', blurb: '3 對 3 輪流砲擊，2–6 人，電腦遊玩', color: '#4cd68a', x0: 13.2, x1: 17.2, y0: .8, y1: 4.6, path: '/artillery/', art(x) { GAME_ART.artillery(x); } },
  { id: 'run', title: '泡泡跑跑', blurb: '一直往前跑，跳過障礙，越遠越高分，單人或 2–4 人同場', color: '#ffb04d', x0: 3.9, x1: 7.9, y0: 8.2, y1: 12, path: '/run/', art(x) { GAME_ART.run(x); } },
  { id: 'survive', title: '泡泡倖存者', blurb: '包住敵人再戳破連鎖，升級配出自己的組合，單人或 2–4 人合作', color: '#8d7bd8', x0: 10.1, x1: 14.1, y0: 8.2, y1: 12, path: '/survive/', art(x) { GAME_ART.survive(x); } },
  { id: 'party', title: '泡泡派對', blurb: '把別人擠下擂台，3 關比積分，單人或 2–6 人（空位補電腦）', color: '#c9b6ff', x0: 7, x1: 11, y0: 13.6, y1: 17.4, path: '/party/', art(x) { GAME_ART.party(x); } },
];

/* ---------- three.js ---------- */
const renderer = new THREE.WebGLRenderer({ canvas: $('scene'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(42, 1, .1, 200);
scene.add(new THREE.HemisphereLight(0xfff6f0, 0xffd6e4, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.7); sun.position.set(6, 20, 10); scene.add(sun);
const wx = x => x - W / 2, wz = y => y - H / 2;
const root = new THREE.Group(); scene.add(root);

{ // 地板：同泡泡島的奶油底 + 草地棋盤
  const base = new THREE.Mesh(G.box, toon('#f3c9b0')); base.scale.set(W + .6, 1, H + .6); base.position.y = -.5; boxOutline(base, W + .6, 1, H + .6); root.add(base);
  const grass = new THREE.Mesh(G.box, toon('#e4f6d4')); grass.scale.set(W + .6, .04, H + .6); root.add(grass);
  const tile = new THREE.PlaneGeometry(1, 1), t2 = toon('#d3efc0');
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { if ((x + y) % 2) continue; const t = new THREE.Mesh(tile, t2); t.rotation.x = -Math.PI / 2; t.position.set(x - W / 2 + .5, .025, y - H / 2 + .5); root.add(t); }
}

function signTexture(r) { // 房間招牌：白底粗描邊的牌子 + 徽章 + 名稱
  const c = document.createElement('canvas'); c.width = 512; c.height = 176; const x = c.getContext('2d');
  x.beginPath(); x.roundRect(8, 8, 496, 160, 36); x.fillStyle = '#fffdf8'; x.fill(); x.lineWidth = 10; x.strokeStyle = INK; x.stroke();
  const b = document.createElement('canvas'); b.width = b.height = 128; const bx = b.getContext('2d'); badgeFrame(bx, r.color);
  if (r.art) r.art(bx); else { bx.font = '900 56px "Zen Maru Gothic",sans-serif'; bx.textAlign = 'center'; bx.textBaseline = 'middle'; bx.lineJoin = 'round'; bx.lineWidth = 8; bx.strokeStyle = INK; bx.strokeText('?', 64, 68); bx.fillStyle = '#fff'; bx.fillText('?', 64, 68); }
  x.drawImage(b, 24, 24, 128, 128);
  x.font = '900 50px "Zen Maru Gothic","PingFang TC",sans-serif'; x.textAlign = 'left'; x.textBaseline = 'middle'; x.fillStyle = INK; x.fillText(r.title, 164, 90, 330);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
for (const r of ROOMS) { // 每間：底板 + 兩根門柱 + 橫樑 + 招牌
  const cx = (r.x0 + r.x1) / 2, cy = (r.y0 + r.y1) / 2, w = r.x1 - r.x0, d = r.y1 - r.y0, col = r.soon ? '#e8dede' : r.color, g = new THREE.Group();
  const pad = new THREE.Mesh(G.box, toon(r.soon ? '#f1e8e8' : col)); pad.scale.set(w, .12, d); pad.position.set(0, .06, 0); boxOutline(pad, w, .12, d); g.add(pad);
  const inner = new THREE.Mesh(G.box, toon(r.soon ? '#faf5f5' : '#fffdf8')); inner.scale.set(w - .7, .02, d - .7); inner.position.set(0, .13, 0); g.add(inner);
  for (const s of [-1, 1]) { const p = new THREE.Mesh(G.box, toon(col)); p.scale.set(.4, 1.5, .4); p.position.set(s * (w / 2 - .2), .8, -d / 2 + .2); boxOutline(p, .4, 1.5, .4); g.add(p); }
  const beam = new THREE.Mesh(G.box, toon(col)); beam.scale.set(w, .3, .4); beam.position.set(0, 1.6, -d / 2 + .2); boxOutline(beam, w, .3, .4); g.add(beam);
  const sign = new THREE.Sprite(new THREE.SpriteMaterial({ map: signTexture(r), transparent: true })); sign.scale.set(3.4, 1.17, 1); sign.position.set(0, 2.5, -d / 2 + .2); g.add(sign);
  g.position.set(wx(cx), 0, wz(cy)); root.add(g);
}

/* ---------- 總積分看板：地墊顯示前 3 名；站上去跳出完整排行 ---------- */
const BOARD = { x0: 1.2, x1: 5.2, y0: 15, y1: 17.65 }, NOTICE = { x0: 12.8, x1: 16.8, y0: 15, y1: 17.65 }; // 地墊範圍，也是觸發區：站上去跳出完整排行
let boardData = null;
const boardCv = document.createElement('canvas'); boardCv.width = 512; boardCv.height = 340;
const boardTex = new THREE.CanvasTexture(boardCv); boardTex.colorSpace = THREE.SRGBColorSpace;
function drawBoard() {
  const x = boardCv.getContext('2d'); x.clearRect(0, 0, 512, 340);
  x.beginPath(); x.roundRect(8, 8, 496, 324, 34); x.fillStyle = '#fffdf8'; x.fill(); x.lineWidth = 10; x.strokeStyle = INK; x.stroke();
  x.fillStyle = INK; x.textBaseline = 'middle'; x.font = '900 46px "Zen Maru Gothic","PingFang TC",sans-serif'; x.textAlign = 'center'; x.fillText('總積分榜', 256, 58);
  const top = boardData?.top?.slice(0, 3) || [], medal = ['#ffd24d', '#d9dde3', '#e6a06b'];
  if (!top.length) { x.font = '700 30px "Zen Maru Gothic","PingFang TC",sans-serif'; x.fillText(boardData ? '還沒有連線成績' : '載入中…', 256, 190); }
  top.forEach((p, i) => {
    const y = 128 + i * 70; x.beginPath(); x.arc(56, y, 24, 0, Math.PI * 2); x.fillStyle = medal[i]; x.fill(); x.lineWidth = 5; x.strokeStyle = INK; x.stroke();
    x.fillStyle = INK; x.textAlign = 'center'; x.font = '900 28px sans-serif'; x.fillText(String(i + 1), 56, y + 1);
    x.textAlign = 'left'; x.font = '900 36px "Zen Maru Gothic","PingFang TC",sans-serif'; x.fillText(p.name, 98, y, 260);
    x.textAlign = 'right'; x.fillText(`${p.points} 分`, 478, y);
  });
  boardTex.needsUpdate = true;
}
function placeMat(R, tex) { // 平鋪在地上的地墊：俯視看得清楚，也不會擋到後面的東西
  const cxB = (R.x0 + R.x1) / 2, cyB = (R.y0 + R.y1) / 2, w = R.x1 - R.x0, d = R.y1 - R.y0;
  const rim = new THREE.Mesh(new THREE.PlaneGeometry(w + .24, d + .24), new THREE.MeshBasicMaterial({ color: 0x3b2f2f })); rim.rotation.x = -Math.PI / 2; rim.position.set(wx(cxB), .045, wz(cyB)); root.add(rim);
  const mat = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ map: tex, transparent: true })); mat.rotation.x = -Math.PI / 2; mat.position.set(wx(cxB), .05, wz(cyB)); root.add(mat);
}
placeMat(BOARD, boardTex); drawBoard();

/* ---------- 布告欄：地墊顯示目前版本；站上去跳出版本與更新資訊 ---------- */
// 更新資訊：最新的在最前面，只留最近 5 筆。由 /release 整理出內容後寫進來。
const CHANGELOG = [
  { date: '2026-10-21', title: '泡泡倖存者上線',
    '新功能': ['新增泡泡倖存者：用泡泡包住敵人，再走進泡泡戳破連鎖，單人或 2 到 4 人合作', '6 種武器、9 種被動，升級三選一，武器升滿可進化', '空白鍵無敵衝刺會空翻，命中顯示傷害數字，武器顯示冷卻', '看板新增倖存者紀錄，記錄存活秒數與擊殺數'],
    '調整': ['所有遊戲的操作提示統一成左側可收合的提示框'] },

  if (me.moving) { me.x = Math.max(.5, Math.min(W - .5, me.x + dx * SPEED * dt)); me.y = Math.max(.5, Math.min(H - .5, me.y + dy * SPEED * dt)); me.f = Math.atan2(dx, dy); }
  if (me.c) {
    me.c.root.position.set(wx(me.x), 0, wz(me.y)); me.c.root.rotation.y += (((me.f - me.c.root.rotation.y + Math.PI * 3) % (Math.PI * 2)) - Math.PI) * Math.min(1, dt * 14);
    animateCritter(me.c, dt, t, me.moving); ring.position.x = wx(me.x); ring.position.z = wz(me.y);
  }
  for (const o of others.values()) {
    const ddx = o.tx - o.x, ddy = o.ty - o.y, mv = Math.hypot(ddx, ddy) > .03;
    o.x += ddx * Math.min(1, dt * 12); o.y += ddy * Math.min(1, dt * 12);
    o.c.root.position.set(wx(o.x), 0, wz(o.y)); if (mv) o.c.root.rotation.y += (((Math.atan2(ddx, ddy) - o.c.root.rotation.y + Math.PI * 3) % (Math.PI * 2)) - Math.PI) * Math.min(1, dt * 14);
    animateCritter(o.c, dt, t, mv);
  }
  // 位置回報：有移動每 100ms 一次，沒動每 10 秒一次（保持連線）
  sendAcc += dt; const moved = Math.abs(me.x - net.lastX) + Math.abs(me.y - net.lastY) > .01;
  if (sendAcc >= (moved ? .1 : 10)) { sendAcc = 0; net.lastX = me.x; net.lastY = me.y; net.send({ t: 'pos', x: +me.x.toFixed(3), y: +me.y.toFixed(3), f: +me.f.toFixed(3) }); }
  // 走進房間：停留半秒才跳出面板，避免路過誤觸
  const r = ROOMS.find(r => !r.soon && inRect(r, me.x, me.y));
  if (r) { dwell += dt; if (!zoneRoom && dwell > .5) showZone(r); renderZoneStatus(); }
  else { dwell = 0; if (zoneRoom) hideZone(); }
  const atBoard = inRect(BOARD, me.x, me.y), bEl = $('board');
  if (atBoard && !bEl.classList.contains('show')) { bEl.classList.add('show'); loadBoard(); if (boardTab !== 'total') loadGames(); } else if (!atBoard && bEl.classList.contains('show')) bEl.classList.remove('show');
  const atNotice = inRect(NOTICE, me.x, me.y), nEl = $('notice');
  if (atNotice && !nEl.classList.contains('show')) { nEl.classList.add('show'); loadNotice(); } else if (!atNotice && nEl.classList.contains('show')) nEl.classList.remove('show');
  renderer.render(scene, camera);
}

/* ---------- 身分按鈕（右上角）：顯示目前身分，點開可改用 Telegram 登入、改用訪客或登出 ---------- */
function renderAcct() {
  const el = $('acctBtn');
  el.textContent = !ID ? '登入' : ID.kind === 'app' ? ID.name : `${ID.name}・${ID.guest ? '訪客' : 'Telegram'}`;
}
$('acctBtn').onclick = async () => {
  if (ID?.kind === 'app') return toast('在 Telegram 裡固定使用 Telegram 身分');
  const next = await openLogin({ title: ID ? '切換身分' : '選擇身分', current: ID, soloLabel: '取消' });
  if (next !== ID) location.reload(); // 身分變了：重新載入，用新身分重連大廳
};

/* ---------- 啟動：一般網頁先選身分（Telegram 或訪客），再選外觀 ---------- */
$('avatarBtn').onclick = async () => { const a = await openAvatarPicker({ initial: me.avatar }); if (a) setMeAvatar(a); };
(async () => {
  layout();
  // 邀請連結（startapp=<遊戲 id>）直接進該遊戲；外觀由遊戲頁面負責檢查
  const start = TG?.initDataUnsafe?.start_param || new URLSearchParams(location.search).get('game');
  const direct = ROOMS.find(r => r.id === start && r.path);
  if (direct) { location.replace(direct.path + (identity() ? '?mode=online' : '')); return; }
  const err = captureLogin(); if (err) toast(LOGIN_ERRORS[err] || `登入失敗（${err}）`, 2600);
  ID = identity();
  if (!ID && !inTelegram) ID = await openLogin({ required: true, title: '歡迎！選擇身分', soloLabel: '先自己逛逛' });
  renderAcct();
  const a = await loadAppearance() || await openAvatarPicker({ required: true, title: '先選你的小傢伙', note: '所有遊戲都會用這個外觀，之後可以按右上角「外觀」更換。' });
  setMeAvatar(a); requestAnimationFrame(tick);
  loadBoard(); setInterval(loadBoard, 30000); loadNotice();
  if (ID) connect(); else $('online').textContent = '單機';
})();
$('online').onclick = async () => {
  if (!ID) return $('acctBtn').click();
  whoOpen = !whoOpen; try { localStorage.setItem('ombw-who-open', whoOpen ? '1' : '0'); } catch {}
  $('online').textContent = $('online').textContent.replace(/ [▴▾]$/, '') + (whoOpen ? ' ▴' : ' ▾'); renderWho();
};
</script>
