# Office Mini Bubble World：入口頁 + 各遊戲頁面 + 連線房間（Durable Object）。name 可改。
name = "office-mini-bubble-world"
main = "dist/worker.bundle.js"   # 已內嵌入口頁與各遊戲；改程式後先 npm run build
compatibility_date = "2025-01-01"

# 音效檔：build.mjs 把各遊戲 assets/ 複製到 dist/public。網址對到檔案就直接回檔案，其他請求才進 Worker
[assets]
directory = "dist/public"

# 選填：[vars] GROUP_ID = "<Telegram 群組 id>" 與 secret BOT_TOKEN 都設了，對戰結束才會把名次貼到群組
# 選填：[vars] ALLOWED_ORIGIN = "https://<你的網址>"：只允許這個網址連線

# 新增遊戲：加一筆 [[durable_objects.bindings]]，再加一筆 [[migrations]] 用下一個 tag；部署過的 tag 不能改

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "LOBBY_ROOM"
class_name = "LobbyRoom"

[[durable_objects.bindings]]
name = "KART_ROOM"
class_name = "KartRoom"

[[durable_objects.bindings]]
name = "ARTILLERY_ROOM"
class_name = "ArtilleryRoom"

[[durable_objects.bindings]]
name = "RUN_ROOM"
class_name = "RunRoom"

[[durable_objects.bindings]]
name = "SURVIVE_ROOM"
class_name = "SurviveRoom"

[[durable_objects.bindings]]
name = "PARTY_ROOM"
class_name = "PartyRoom"

[[durable_objects.bindings]]
name = "TOGETHER_ROOM"
class_name = "TogetherRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LobbyRoom"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["KartRoom"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["ArtilleryRoom"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["RunRoom"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["SurviveRoom"]

[[migrations]]
tag = "v7"
new_sqlite_classes = ["PartyRoom"]

[[migrations]]
tag = "v8"
new_sqlite_classes = ["TogetherRoom"]
