<head>

<title>泡泡碰碰島</title>

<style>
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
body { touch-action: none; user-select: none; -webkit-user-select: none; }
canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; } /* canvas 不會被 inset 撐開，高解析度螢幕要明確指定大小 */
.btn[aria-pressed="true"] { background: var(--pink); color: #4a3b3b; }

/* HUD */
.hud { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.timer.hurry { background: var(--pink); color: #4a3b3b; }
.timer { padding: 2px 16px; font-weight: 900; font-size: 20px; font-variant-numeric: tabular-nums; }
.players { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; width: min(560px, 100%); }
.pl { padding: 4px 6px; border-radius: 14px; font-size: 11px; line-height: 1.3; border-width: 2px; }
.pl b { display: flex; align-items: center; gap: 4px; font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.pl i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink); flex: none; }
.pl.trapped { background: #d8f0ff; color: #4a3b3b; }
.pl.dead { opacity: .45; }
.pl .st { color: var(--ink-soft); }
.pl.trapped .st { color: #4a3b3b; }

/* 觸控 */
.pad { position: fixed; bottom: max(18px, env(safe-area-inset-bottom)); left: 0; right: 0; display: none; justify-content: space-between; align-items: flex-end; padding: 0 22px; pointer-events: none; }
body.touch .pad { display: flex; }
.stick { width: 140px; height: 140px; border-radius: 50%; border: 3px solid var(--ink); background: color-mix(in srgb, var(--paper) 70%, transparent); position: relative; pointer-events: auto; touch-action: none; }
.knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: var(--pink); border: 3px solid var(--ink); }
.acts { display: flex; flex-direction: column; gap: 12px; align-items: center; pointer-events: auto; }
.act { border: 3px solid var(--ink); border-radius: 50%; font-weight: 900; box-shadow: var(--shadow); touch-action: none; }
.act.bomb { width: 96px; height: 96px; background: var(--blue); font-size: 18px; color: #2c3a4a; }
.keys { position: fixed; bottom: 12px; right: 12px; font-size: 12px; padding: 6px 12px; }
body.touch .keys { display: none; }

/* 畫面 */
.screen { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(74,59,59,.28); z-index: 10; }
.screen[hidden] { display: none; }
.screen .box { width: min(400px, calc(100% - 28px)); padding: 20px; text-align: center; max-height: calc(100% - 28px); overflow: auto; }
.screen h1 { margin: 0; font-size: 30px; font-weight: 900; }
.screen h2 { margin: 0 0 6px; font-size: 24px; font-weight: 900; }
.screen p { margin: 6px 0 12px; color: var(--ink-soft); font-size: 13px; line-height: 1.6; }
.row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 8px 0; }
.lbl { font-weight: 700; font-size: 13px; margin-top: 12px; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--ink); cursor: pointer; }
.sw[aria-pressed="true"] { outline: 3px solid var(--pink-deep); outline-offset: 2px; }
.go { margin-top: 16px; width: 100%; padding: 10px; font-size: 17px; }
.back { display: inline-block; margin-top: 10px; text-decoration: none; color: var(--ink); }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; text-align: left; font-size: 12.5px; margin-top: 10px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink); margin-right: 6px; vertical-align: -1px; background: var(--c); }
.rank { text-align: left; margin: 8px 0 0; padding: 0; list-style: none; font-size: 14px; }
.rank li { display: flex; justify-content: space-between; padding: 5px 4px; border-bottom: 1px dashed var(--line); }
.rank li:last-child { border: 0; }
.toast { position: fixed; left: 50%; top: calc(max(10px, env(safe-area-inset-top)) + 92px); transform: translate(-50%, 0) scale(.8); font-size: 15px; font-weight: 900; padding: 4px 16px; border-width: 2px; max-width: calc(100% - 24px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .2s, transform .3s cubic-bezier(.3,1.6,.6,1); pointer-events: none; z-index: 5; }
.toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
#endScreen { background: transparent; place-items: end center; pointer-events: none; }
#endScreen .box { pointer-events: auto; margin-bottom: max(14px, env(safe-area-inset-bottom)); max-height: 46%; padding: 12px 16px; }
#endScreen h2 { font-size: 20px; margin: 0; }
#endScreen p { margin: 2px 0 6px; }
#endScreen .rank { margin: 0; font-size: 13px; }
#endScreen .rank li { padding: 3px 4px; }
#endScreen .go { margin-top: 8px; padding: 7px; }
.endnote { margin: 6px 0 0; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.endnote.best { color: var(--pink-deep); font-size: 15px; }
.me-tag { position: fixed; transform: translate(-50%, -100%); pointer-events: none; background: var(--pink); color: #4a3b3b; border: 2px solid var(--ink); border-radius: 999px; padding: 0 10px; font-weight: 900; font-size: 13px; z-index: 4; }
.me-tag[hidden] { display: none; }
.mute { position: fixed; top: max(10px, env(safe-area-inset-top)); right: 10px; z-index: 6; padding: 4px 10px; font-size: 12px; }
.preview { width: 132px; height: 132px; margin: 4px auto 0; border-radius: 50%; background: radial-gradient(circle at 50% 62%, var(--chip) 0 55%, transparent 70%); }
.preview canvas { width: 100%; height: 100%; display: block; }
.slots i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink); margin-right: 6px; vertical-align: -1px; }
.slots li.empty { color: var(--ink-soft); }
/* 矮螢幕（手機橫放）：狀態欄改成左上直列，選單壓縮 */
@media (max-height: 520px) and (orientation: landscape) {
  .hud { left: max(10px, env(safe-area-inset-left)); right: auto; top: 8px; align-items: flex-start; width: 150px; }
  .timer { font-size: 16px; padding: 0 12px; }
  .players { grid-template-columns: 1fr; width: 150px; gap: 4px; }
  .pl { padding: 2px 6px; }
  .pad { padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); bottom: max(10px, env(safe-area-inset-bottom)); }
  .stick { width: 120px; height: 120px; }
  .act.bomb { width: 84px; height: 84px; }
  .screen .box { width: min(560px, calc(100% - 20px)); max-height: calc(100% - 16px); padding: 12px 16px; }
  .screen h1 { font-size: 22px; }
  .screen h2 { font-size: 20px; }
  .screen p, .legend { display: none; }
  .preview { width: 84px; height: 84px; margin: 0 auto; }
  .lbl { margin-top: 6px; }
  .row { margin: 4px 0; }
  .go { margin-top: 10px; padding: 7px; }
  .toast { top: 8px; }
  #endScreen .box { max-height: calc(100% - 16px); width: min(380px, calc(100% - 340px)); margin-bottom: 8px; }
}
/* 窄螢幕直放：狀態欄縮小 */
@media (max-width: 380px) {
  .pl { font-size: 10px; padding: 3px 5px; }
  .pl b { font-size: 11px; }
  .stick { width: 124px; height: 124px; }
  .act.bomb { width: 86px; height: 86px; }
}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="hud">
  <div class="timer box" id="timer">3:00</div>
  <div class="players" id="players"></div>
</div>
<button class="btn mute" id="mute">音效 開</button>

<div class="pad">
  <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
  <div class="acts">
    <button class="act bomb" id="bombBtn">水球</button>
  </div>
</div>

<div class="toast box" id="toast"></div>
<div class="me-tag" id="meTag" hidden>你</div>

<section class="screen" id="startScreen">
  <div class="box">
    <h1>泡泡碰碰島</h1>
    <p>放水球、炸開箱子、撿道具。被水柱噴到會被泡泡困住，被別人碰到就出局，撐到最後的小傢伙獲勝。</p>
    <div class="row"><button class="btn" id="avatarBtn">換外觀</button><button class="btn" id="onlineBtn">連線對戰</button></div>
    <div class="lbl">對手強度</div>
    <div class="row" id="diffs"></div>
    <div class="legend">
      <span style="--c:#5ab8ff">水球 +1</span><span style="--c:#ffc23d">水柱 +1</span>
      <span style="--c:#4cd68a">速度鞋：跑更快</span><span style="--c:#ff8a4c">踢鞋：走進水球把它踢走</span>
      <span style="--c:#c86bff">超級水球：水柱 15 格</span>
    </div>
    <button class="btn primary go" id="startBtn">開始</button>
    <a class="btn back" href="/">回遊戲大廳</a>
  </div>
</section>

<section class="screen" id="endScreen" hidden>
  <div class="box">
    <h2 id="endTitle"></h2>
    <p id="endSub"></p>
    <ul class="rank" id="rank"></ul>
    <p class="endnote" id="endNote" hidden></p>
    <button class="btn primary go" id="againBtn">再玩一局</button>
    <a class="btn back" href="/">回遊戲大廳</a>
  </div>
</section>

<section class="screen" id="lobbyScreen" hidden>
  <div class="box">
    <h1>泡泡碰碰島</h1>
    <p id="lobbyStatus">連線中…</p>
    <ul class="rank slots" id="slots"></ul>
    <div class="row"><button class="btn" id="lAvatarBtn">換外觀</button></div>
    <button class="btn primary go" id="joinBtn">加入</button>
    <button class="btn" id="soloBtn" style="margin-top:10px">先玩單人版</button>
    <a class="btn back" href="/">回遊戲大廳</a>
  </div>
</section>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import * as Core from './game-core.js';
import { INK, ITEM_ART, badgeFrame } from '/shared/draw.js';
import { loadAppearance, openAvatarPicker } from '/shared/avatar.js';
import { watchUpdates } from '/shared/update.js';
import { soloStart, soloFinish, showSoloNote } from '/shared/solo-record.js';
watchUpdates(); // 有新版本時在畫面上方提醒重新整理
import { identity, openLogin, captureLogin, LOGIN_ERRORS } from '/shared/session.js';
import { toon, OUTLINE, G, M, withOutline, blob, boxOutline, makeCritter, addNameTag } from '/shared/three-kit.js';

/* ================= 連線設定：部署 Worker 後改這一行 ================= */
const WORKER_URL = location.origin; // 頁面由同一個 Worker 提供，WebSocket 連 wss://<同網域>/ws
/* ================================================================== */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

/* ---------- Telegram（沒有在 Telegram 裡開啟時全部略過） ---------- */
const TG = window.Telegram?.WebApp;
const inTelegram = !!(TG && TG.initData);
const tgUser = inTelegram ? TG.initDataUnsafe?.user : null;
if (inTelegram) {
  try { TG.ready(); TG.expand(); TG.disableVerticalSwipes?.(); } catch {}
  if (TG.colorScheme) document.documentElement.dataset.theme = TG.colorScheme;
}
const haptic = {
  tap() { try { TG?.HapticFeedback?.impactOccurred('light'); } catch {} },
  hit() { try { TG?.HapticFeedback?.notificationOccurred('error'); } catch {} },
  win() { try { TG?.HapticFeedback?.notificationOccurred('success'); } catch {} },
};

/* ---------- 音效 ---------- */
let muted = store.get('bp-muted') === '1';
let actx = null;
function tone(freq, dur = .12, type = 'sine', vol = .15, slide = 0) {
  if (muted) return;
  try {
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch {}
}
const sfx = {
  place: () => tone(520, .1, 'sine', .12, 1.6),
  boom: () => { tone(180, .35, 'triangle', .2, .4); tone(900, .18, 'sine', .06, .5); },
  item: () => { tone(880, .08, 'sine', .1); setTimeout(() => tone(1320, .12, 'sine', .1), 70); },
  trap: () => tone(300, .5, 'sine', .14, 2.2),
  pop: () => tone(1200, .15, 'square', .06, .3),
};
$('mute').textContent = muted ? '音效 關' : '音效 開';
$('mute').addEventListener('click', () => { muted = !muted; store.set('bp-muted', muted ? '1' : '0'); $('mute').textContent = muted ? '音效 關' : '音效 開'; });


/* ---------- 常數（規則在 game-core.js） ---------- */
const { COLS, ROWS, BOMB_TIME, FLAME_TIME, FLAME_FADE, BASE_SPEED, SPEED_STEP, SUPER_POWER, COLORS, EARS, DIFFS } = Core;
// ?time=60 可縮短單人版一局秒數，方便測試
const ROUND_TIME = Math.max(45, Number(new URLSearchParams(location.search).get('time')) || 180);
// 道具外觀：顏色 + 繪製圖示徽章（永遠面向鏡頭）+ 地上光圈，一眼分得出來
const ITEMS = {
  bomb:  { color: '#5ab8ff', label: '水球+1', name: '水球 +1' },
  power: { color: '#ffc23d', label: '水柱+1', name: '水柱 +1' },
  speed: { color: '#4cd68a', label: '速度鞋', name: '速度鞋' },
  kick:  { color: '#ff8a4c', label: '踢鞋', name: '踢鞋' },
  super: { color: '#c86bff', label: '超級', name: '超級水球' },
};
const loginErr = captureLogin(); // Telegram 登入轉址回來時把憑證存起來
let ID = identity();
const ONLINE = !!ID && /^https?:\/\//.test(WORKER_URL);
let mode = ONLINE ? 'online' : 'offline';

/* ---------- three.js ---------- */
const canvas = $('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, .1, 200);
scene.add(new THREE.HemisphereLight(0xfff6f0, 0xffd6e4, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.7); sun.position.set(6, 20, 10); scene.add(sun);

/* ---------- 版面 ---------- */
const wx = x => x - (COLS - 1) / 2, wz = y => y - (ROWS - 1) / 2;
const boardRoot = new THREE.Group(); scene.add(boardRoot);
const base = new THREE.Mesh(G.box, toon('#f3c9b0')); base.scale.set(COLS + .6, 1, ROWS + .6); base.position.y = -.5; boxOutline(base, COLS + .6, 1, ROWS + .6); boardRoot.add(base);
const grass = new THREE.Mesh(G.box, toon('#e4f6d4')); grass.scale.set(COLS + .6, .04, ROWS + .6); grass.position.y = .0; boardRoot.add(grass);
for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
  if ((x + y) % 2) continue;
  const t = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), toon('#d3efc0')); t.rotation.x = -Math.PI / 2; t.position.set(wx(x), .025, wz(y)); boardRoot.add(t);
}
const SOFT_COLORS = ['#ffd0dc', '#ffe3b8', '#e2d6ff', '#cdeef9'];

/* ---------- 畫面狀態（離線、連線共用：一律從 snapshot 畫） ---------- */
let V = null;          // 目前畫面上的這一局
let playing = false;   // 有一局正在進行（隱藏開始／大廳畫面）
let local = null;      // 單人版：本機跑 game-core
const buf = [];        // 連線版：收到的位置快照，用來內插
const INTERP_MS = 100;
let setup = {
  color: COLORS[0], ear: 'be', eye: 'dot', // 載入後由 applyAppearance 設定
  diff: store.get('bp-diff') || 'normal',
};
const myName = (ID?.name || tgUser?.first_name || store.get('bp-name') || '你').slice(0, 10);

function makeHard(x, y, dropped) {
  const m = new THREE.Mesh(G.box, toon(dropped ? '#ffb3c7' : '#b9a7e8')); m.scale.set(.92, .62, .92); m.position.set(wx(x), .31, wz(y)); boxOutline(m, .92, .62, .92);
  const cap = new THREE.Mesh(G.box, toon(dropped ? '#ffd0dc' : '#d4c8f5')); cap.scale.set(.96, .12, .96); cap.position.set(0, .5, 0); m.add(cap);
  boardRoot.add(m); return m;
}
function makeBomb(x, y) {
  const mesh = new THREE.Group();
  const ball = blob(G.sphere, M.balloon, .38, .36, .38, 1.06); ball.position.y = .4; mesh.add(ball);
  const knot = blob(G.small, M.balloon, .08, .06, .08, 1.2); knot.position.y = .8; mesh.add(knot);
  const hl = new THREE.Mesh(G.small, M.white); hl.scale.set(.07, .1, .04); hl.position.set(-.16, .55, .3); mesh.add(hl);
  mesh.position.set(wx(x), 0, wz(y)); boardRoot.add(mesh);
  return { mesh, ball, t: BOMB_TIME, tx: x, ty: y };
}
function makeFlame(x, y, center) {
  const mesh = new THREE.Group();
  const s = blob(G.cyl, M.splash, .44, .22, .44, 1.05); s.position.y = .12; mesh.add(s);
  const core = new THREE.Mesh(G.cyl, M.splashCore); core.scale.set(.26, .24, .26); core.position.y = .14; mesh.add(core);
  for (let i = 0; i < (center ? 5 : 2); i++) {
    const d = blob(G.small, M.splash, .1, .12, .1, 1.15); d.position.set((Math.random() - .5) * .7, .35 + Math.random() * .4, (Math.random() - .5) * .7); mesh.add(d);
  }
  mesh.position.set(wx(x), 0, wz(y)); boardRoot.add(mesh);
  return { mesh, t: FLAME_TIME };
}
const badgeTex = new Map();
function itemBadge(kind) {
  if (badgeTex.has(kind)) return badgeTex.get(kind);
  const it = ITEMS[kind], c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  badgeFrame(x, it.color);
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.save(); (ITEM_ART[kind] || ITEM_ART.bomb)(x); x.restore();
  x.font = '900 21px "Zen Maru Gothic","PingFang TC",sans-serif'; x.fillStyle = '#3b2f2f'; x.fillText(it.label, 64, 95);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; badgeTex.set(kind, t); return t;
}
function makeItem(x, y, kind) {
  const it = ITEMS[kind] || ITEMS.bomb, mesh = new THREE.Group();
  const baseDisc = blob(G.cyl, toon(it.color), .3, .06, .3, 1.08); baseDisc.position.y = .05; mesh.add(baseDisc);
  const glow = new THREE.Mesh(G.disc, new THREE.MeshBasicMaterial({ color: it.color, transparent: true, opacity: .5, depthWrite: false, blending: THREE.AdditiveBlending }));

addEventListener('resize', resize); resize();
if (inTelegram) { try { TG.onEvent('viewportChanged', resize); } catch {} }

// 狀態欄高度會隨玩家清單變動，跟著重新對齊棋盤

const clock = new THREE.Clock();
const tagPos = new THREE.Vector3();
let hudTick = 0;

// 連線版位置內插：畫 INTERP_MS 之前的狀態，夾在兩個快照之間
function posOf(id, d) {
  // 自己的角色直接用最新位置（不延遲 INTERP_MS），畫面才跟伺服器判定對得上
  if (mode !== 'online' || buf.length < 2 || id === V.myId) return [d.x, d.y];
  const rt = performance.now() - INTERP_MS;
  let i = buf.length - 2; while (i > 0 && buf[i].at > rt) i--;
  const a = buf[i], b = buf[i + 1]; if (!a.ps[id] || !b.ps[id]) return [d.x, d.y];
  const k = Math.max(0, Math.min(1, (rt - a.at) / Math.max(1, b.at - a.at)));
  return [a.ps[id][0] + (b.ps[id][0] - a.ps[id][0]) * k, a.ps[id][1] + (b.ps[id][1] - a.ps[id][1]) * k];
}
function animate(dt, t) {
  const v = V;
  for (const b of v.bombs.values()) {
    b.t -= dt;
    const pulse = 1 + Math.sin(t * (10 + (BOMB_TIME - b.t) * 8)) * .06 + (b.t < .6 ? .08 : 0);
    b.ball.scale.set(.38 * pulse, .36 / pulse, .38 * pulse);
    const kk = Math.min(1, dt * 18); // 被踢的水球滑動
    b.mesh.position.x += (wx(b.tx) - b.mesh.position.x) * kk; b.mesh.position.z += (wz(b.ty) - b.mesh.position.z) * kk;
  }

    f.t -= dt;
    const k = f.t > FLAME_FADE ? 1 : Math.max(0, f.t) / FLAME_FADE, wob = k === 1 ? 1 + Math.sin(t * 28 + f.mesh.position.x) * .05 : 1;
    f.mesh.scale.set((1 + (1 - k) * .2) * wob, Math.max(.02, k) * wob, (1 + (1 - k) * .2) * wob);
    f.mesh.visible = f.t > 0;
  }
  for (const it of v.items.values()) {
    if (it.pending > 0) { it.pending -= dt; continue; }
    it.age += dt;
    it.mesh.scale.setScalar(Math.min(1, it.age * 5));
    it.icon.position.y = .7 + Math.sin(t * 3 + it.x) * .08;
    it.glow.material.opacity = .35 + Math.sin(t * 4 + it.y) * .2; it.glow.scale.setScalar(.46 + Math.sin(t * 4 + it.y) * .05);
    if (it.kind === 'super') it.icon.material.rotation = Math.sin(t * 5) * .15;
  }
  for (const f of [...v.fx]) {
    f.t += dt; const k = Math.min(1, f.t / f.dur);
    if (f.kind === 'crumble') { f.mesh.scale.set(.84 * (1 + k * .4), .52 * (1 - k), .84 * (1 + k * .4)); f.mesh.position.y = .26 * (1 - k); }
    if (f.kind === 'ghost') { f.mesh.position.y = k * 2.2; f.mesh.scale.setScalar(.86 * (1 - k * .7)); f.mesh.rotation.y += dt * 6; }
    if (f.kind === 'drop') { f.mesh.position.y = .31 + (1 - k * k) * 5.7; if (k >= 1) { v.fx.splice(v.fx.indexOf(f), 1); continue; } }
    if (k >= 1) { boardRoot.remove(f.mesh); v.fx.splice(v.fx.indexOf(f), 1); }
  }
  for (const { c, d: p } of v.players) {
    if (p.state === 'dead') continue;
    const moving = !!p.mv, [px, py] = posOf(p.id, p);
    c.root.position.x = wx(px); c.root.position.z = wz(py);
    let d = p.face - c.root.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); c.root.rotation.y += d * Math.min(1, dt * 14);
    const trapped = p.state === 'trapped';
    const walk = moving && !trapped ? Math.abs(Math.sin(t * 13 + c.phase)) : 0;
    const sq = 1 + (moving ? (walk - .5) * .1 : Math.sin(t * 2.2 + c.phase) * .035);
    c.pivot.position.y = walk * .14 + (trapped ? .18 + Math.sin(t * 3) * .05 : 0);
    c.pivot.scale.set(1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq));
    c.bubble.visible = c.shine.visible = trapped;
    if (c.marker) {
      c.marker.arrow.position.y = (trapped ? 2.2 : 1.85) + c.pivot.position.y * .6 + Math.sin(t * 5) * .12;
      c.marker.arrow.rotation.y = -c.root.rotation.y + t * 2;
      const pulse = 1 + Math.sin(t * 4) * .08;
      c.marker.ring.scale.setScalar(pulse); c.marker.ring.material.opacity = .55 + Math.sin(t * 4) * .25;
      c.marker.arrow.getWorldPosition(tagPos); tagPos.y += .45; tagPos.project(camera);
      const tag = $('meTag'); tag.hidden = !playing || tagPos.z > 1;
      tag.style.left = (tagPos.x * .5 + .5) * innerWidth + 'px'; tag.style.top = (-tagPos.y * .5 + .5) * innerHeight + 'px';
    }
    if (trapped) { const w = 1 + Math.sin(t * 6) * .04; c.bubble.scale.set(.78 * w, .78 / w, .78 * w); c.bubble.position.y = .55 + c.pivot.position.y * .5; c.shine.position.y = .95 + c.pivot.position.y * .5; }

    const blink = c.blinkAt < 0 && c.blinkAt > -.12;

}
function tick() {
