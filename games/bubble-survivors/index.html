<style>

/* HUD */

.endnote.best { color: var(--pink-deep); font-size: 15px; }

@media (max-height: 520px) and (orientation: landscape) {
  .screen .box { width: min(560px, calc(100% - 20px)); max-height: calc(100% - 16px); padding: 12px 16px; }

  #endScreen .box { max-height: calc(100% - 16px); width: min(380px, calc(100% - 340px)); margin-bottom: 8px; }

<body>
<canvas id="scene"></canvas>
<div class="vignette" id="vig"></div>
<div class="hudtop"><div class="clock box"><b id="clock">5:00</b><small id="wave">第 1 波</small></div><div class="bossbar box" id="bossbar" hidden><i id="bossfill"></i></div></div>
<div class="team" id="team" hidden></div>
<div class="count" id="count" hidden></div>
<div class="choose" id="choose" hidden><h3 class="box" id="chooseTitle"></h3><div class="cards" id="cards"></div><button class="btn rerollbtn" id="rerollBtn" type="button">重抽 (R)</button></div>
<div class="hudbot" id="hudbot" hidden><div class="grp"><span class="lbl">武器</span><div class="wrow" id="wchips"></div></div><div class="grp"><span class="lbl">升級</span><div class="chips" id="pchips"></div></div><div class="bars"><div class="bar hp box"><i id="hpFill"></i><span id="hpText"></span></div><div class="bar xp box"><i id="xpFill"></i><span id="xpText"></span></div></div></div>
<button class="dashbtn" id="dashBtn" type="button" hidden><i id="dashFill"></i><span>衝刺<small id="dashKey">空白</small></span></button>
<div class="stick" id="stick" hidden><div class="knob" id="knob"></div></div>
<button class="btn mute" id="mute">音效 開</button>
<div class="toast box" id="toast"></div>

<section class="screen" id="startScreen">
  <div class="box">
    <h1>泡泡倖存者</h1>
    <p>用泡泡包住湧來的敵人，再走進泡泡戳破，連鎖爆炸清場。撐 5 分鐘或打倒泡泡王就過關，升級時三選一配出自己的組合。</p>
    <div class="row"><button class="btn" id="avatarBtn">換外觀</button><button class="btn" id="onlineBtn">連線合作</button></div>
    <div class="legend"><span>泡泡：包住敵人</span><span>走進泡泡：戳破連鎖</span><span>碎片：撿滿升級</span><span>連線：2 到 4 人合作</span></div>
    <button class="btn primary go" id="startBtn">開始</button>
    <a class="btn back" href="/">回遊戲大廳</a>
  </div>
</section>

<section class="screen" id="endScreen" hidden>
  <div class="box">
    <h2 id="endTitle"></h2>
    <p id="endSub"></p>
    <ul class="rank" id="rank"></ul>
    <p class="endnote" id="endNote" hidden></p>
    <button class="btn primary go" id="againBtn">再玩一局</button>
    <a class="btn back" href="/">回遊戲大廳</a>
  </div>
</section>

<section class="screen" id="lobbyScreen" hidden>
  <div class="box">
    <h1>泡泡倖存者</h1>
    <p id="lobbyStatus">連線中…</p>
    <ul class="rank slots" id="slots"></ul>
    <div class="row"><button class="btn" id="lAvatarBtn">換外觀</button></div>
    <button class="btn primary go" id="joinBtn">加入</button>
    <button class="btn" id="soloBtn" style="margin-top:10px">先玩單人版</button>
    <a class="btn back" href="/">回遊戲大廳</a>
  </div>
</section>

<script type="importmap">

<script type="module">
import * as THREE from 'three';
import * as Core from './survivors-core.js';
import { loadAppearance, openAvatarPicker } from '/shared/avatar.js';
import { watchUpdates } from '/shared/update.js';
import { mountKeyHelp } from '/shared/keyhelp.js';
import { soloStart, soloFinish, showSoloNote } from '/shared/solo-record.js';
import { identity, openLogin, captureLogin, LOGIN_ERRORS } from '/shared/session.js';
import { toon, G, M, blob, withOutline, makeCritter, addNameTag, animateCritter } from '/shared/three-kit.js';
watchUpdates();
mountKeyHelp({ rows: ['[W][A][S][D] 或 [方向鍵] 移動（手機拖曳）', '[空白] 無敵衝刺（手機點右下按鈕）', '攻擊自動，泡泡會包住敵人', '走進被包住的敵人 戳破它', '[1][2][3] 升級選擇　[R] 重抽'], top: '190px' });

const WORKER_URL = location.origin;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

/* ---------- Telegram ---------- */
const TG = window.Telegram?.WebApp;
const inTelegram = !!(TG && TG.initData);
const tgUser = inTelegram ? TG.initDataUnsafe?.user : null;
if (inTelegram) {
  try { TG.ready(); TG.expand(); TG.disableVerticalSwipes?.(); } catch {}
  if (TG.colorScheme) document.documentElement.dataset.theme = TG.colorScheme;
}
const haptic = {
  tap() { try { TG?.HapticFeedback?.impactOccurred('light'); } catch {} },
  hit() { try { TG?.HapticFeedback?.notificationOccurred('error'); } catch {} },
  win() { try { TG?.HapticFeedback?.notificationOccurred('success'); } catch {} },
};

/* ---------- 音效 ---------- */
let muted = store.get('bp-muted') === '1', actx = null, lastTone = 0;
function tone(freq, dur = .12, type = 'sine', vol = .12, slide = 0) {
  if (muted) return;
  const now = performance.now(); if (now - lastTone < 30) return; lastTone = now;
  try {
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch {}
}
const sfx = {
  pop: d => tone(300 + Math.min(8, d) * 70, .14, 'sine', .12, 1.8),
  poke: () => tone(900, .06, 'square', .04, .6),
  wave: () => tone(220, .3, 'sine', .1, 2.2),
  level: () => { tone(660, .1, 'sine', .1); setTimeout(() => tone(990, .16, 'sine', .1), 90); },
  hurt: () => tone(180, .2, 'triangle', .14, .5),
  out: () => { tone(260, .4, 'triangle', .16, .4); tone(120, .3, 'sine', .1, .5); },
  boss: () => { tone(110, .6, 'sawtooth', .1, .6); },
  dash: () => tone(500, .16, 'sawtooth', .07, 2.4),
  tick: () => tone(660, .1, 'square', .05),
  go: () => { tone(880, .18, 'square', .06); tone(1320, .25, 'sine', .08); },
};
$('mute').textContent = muted ? '音效 關' : '音效 開';
$('mute').addEventListener('click', e => { e.stopPropagation(); muted = !muted; store.set('bp-muted', muted ? '1' : '0'); $('mute').textContent = muted ? '音效 關' : '音效 開'; });

const S = 34; // 1 個世界單位 = 34 點
const loginErr = captureLogin();
let ID = identity();
let mode = ID && /^https?:\/\//.test(WORKER_URL) ? 'online' : 'offline';
const TOUCH = matchMedia('(pointer: coarse)').matches || inTelegram || new URLSearchParams(location.search).has('touch');
if (TOUCH) document.body.classList.add('touch');

/* ---------- three.js ---------- */
const renderer = new THREE.WebGLRenderer({ canvas: $('scene'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(26, 1, .1, 300);
scene.add(new THREE.HemisphereLight(0xfff6f0, 0xffd6e4, 1.8));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(6, 20, 8); scene.add(sun);
const root = new THREE.Group(); scene.add(root);
const AW = Core.ARENA.W / S, AH = Core.ARENA.H / S;
{
  const cv = document.createElement('canvas'); cv.width = cv.height = 128; const x = cv.getContext('2d');
  x.fillStyle = '#e4f6d4'; x.fillRect(0, 0, 128, 128); x.fillStyle = '#d3efc0'; x.fillRect(0, 0, 64, 64); x.fillRect(64, 64, 64, 64);
  const tex = new THREE.CanvasTexture(cv); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(AW / 4, AH / 4); tex.colorSpace = THREE.SRGBColorSpace;
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(AW, AH), new THREE.MeshBasicMaterial({ map: tex })); ground.rotation.x = -Math.PI / 2; ground.position.set(AW / 2, 0, AH / 2); root.add(ground);
  const wall = (w, d, px, pz) => { const m = new THREE.Mesh(G.box, toon('#f3c9b0')); m.scale.set(w, .5, d); m.position.set(px, .25, pz); withOutline(m, 1.02); root.add(m); };
  wall(AW + 1, .6, AW / 2, -.3); wall(AW + 1, .6, AW / 2, AH + .3); wall(.6, AH, -.3, AH / 2); wall(.6, AH, AW + .3, AH / 2);

function floatText(x, y, text, cls, size) {
  const host = document.body; if (host.querySelectorAll('.dmg').length > 50) return;
  const v = new THREE.Vector3(x / S, .9, y / S).project(camera); if (v.z > 1 || Math.abs(v.x) > 1.1 || Math.abs(v.y) > 1.1) return;
  const el = document.createElement('div'); el.className = 'dmg ' + cls; el.textContent = text; if (size) el.style.fontSize = size + 'px';
  el.style.left = ((v.x * .5 + .5) * innerWidth + (Math.random() - .5) * 18) + 'px'; el.style.top = ((-v.y * .5 + .5) * innerHeight - 6) + 'px';
  host.append(el); setTimeout(() => el.remove(), 850);
}

/* ---------- 連鎖合計 ---------- */
const chains = new Map();
function chainAdd(ev) {
  if (ev.c == null) return;
  let c = chains.get(ev.c); if (!c) { c = { x: ev.x, y: ev.y, sum: 0, pops: 0, kills: 0, last: 0, shown: '', el: null }; chains.set(ev.c, c); }
  c.last = performance.now(); c.x = ev.x; c.y = ev.y;
  if (ev.type === 'd') { c.sum += ev.v; if (ev.k) c.kills++; } else c.pops++;
}
function updateChains() {
  const now = performance.now();
  for (const [id, c] of chains) {
    const idle = now - c.last;
    if (idle > 1500) { c.el?.remove(); chains.delete(id); continue; }
    if (c.pops < 2 && c.sum < 160) continue;
    if (!c.el) { c.el = document.createElement('div'); c.el.className = 'chainbox'; document.body.append(c.el); }
    const html = `連鎖 ×${c.pops}<b>${c.sum}</b>`;
    if (html !== c.shown) { c.shown = html; c.el.innerHTML = html; c.el.style.fontSize = (17 + Math.min(14, c.pops * 1.4)) + 'px'; c.el.classList.remove('bump'); void c.el.offsetWidth; c.el.classList.add('bump'); }
    c.el.classList.toggle('out', idle > 800);
    const v = new THREE.Vector3(c.x / S, 1.4, c.y / S).project(camera);
    c.el.style.left = Math.max(60, Math.min(innerWidth - 60, (v.x * .5 + .5) * innerWidth)) + 'px'; c.el.style.top = Math.max(60, (-v.y * .5 + .5) * innerHeight - 24) + 'px';
  }
}

/* ---------- 事件 ---------- */
function onEvents(evs, s) {
  if (!V) return; let n = 0;
  const nums = (evs || []).filter(e => e.type === 'd'); let bursts = 0;
  for (const e of nums) {
    chainAdd(e);
    const en = e.i != null ? V.enemies.get(e.i) : null; if (en) { en.flash = .16; if (en.type === 'boss') shake = Math.max(shake, .3); }
    if (e.k && bursts++ < 6) addRing(e.x, e.y, 40, 0xffd36b, .25);
  }
  for (const e of [...nums].sort((a, b) => b.v - a.v).slice(0, 10)) floatText(e.x, e.y, e.v, e.k ? 'kill' : e.d >= 1 ? 'chain' : e.v >= 60 ? 'big' : '', 12 + Math.min(10, e.v / 9) + e.d * 1.2 + (e.k ? 4 : 0));
  for (const ev of evs || []) {
    if (ev.type === 'd') continue;
    if (++n > 60) break;
    if (ev.type === 'pop') { chainAdd(ev); addRing(ev.x, ev.y, ev.r, ev.d ? 0xffb04d : 0xff8fab, .35); sfx.pop(ev.d); shake = Math.max(shake, Math.min(.4, .05 + ev.d * .035)); }
    else if (ev.type === 'bolt') { for (let k = 1; k < ev.pts.length; k++) addLine(ev.pts[k - 1][0], ev.pts[k - 1][1], ev.pts[k][0], ev.pts[k][1], 0xfff27a); sfx.poke(); }
    else if (ev.type === 'wave') { addRing(ev.x, ev.y, ev.r, ev.k ? 0xffd36b : 0x7cc8ff, .5); if (ev.id === V.myId || mode === 'offline') sfx.wave(); }
    else if (ev.type === 'poke') { addLine(ev.x, ev.y, ev.tx, ev.ty); sfx.poke(); }
    else if (ev.type === 'level') { const p = V.players.get(ev.id); if (p) addRing(p.x, p.y, 70, 0xffd36b, .6); if (ev.id === (mode === 'offline' ? 0 : V.myId)) { sfx.level(); haptic.win(); } }
    else if (ev.type === 'zone') addRing(ev.x, ev.y, ev.r, ev.kind === 'rain' ? 0x7cc8ff : ev.kind === 'foam' ? 0xffb3e6 : 0xc86bff, ev.t, ev.kind !== 'pull');
    else if (ev.type === 'dash') { addRing(ev.x, ev.y, 46, 0xbfe9ff, .3); if (ev.id !== (mode === 'offline' ? 0 : V.myId)) tone(500, .1, 'sawtooth', .03, 2); }
    else if (ev.type === 'hurt') { const hp = V.players.get(ev.id); if (hp && ev.v) floatText(hp.x, hp.y - 20, '-' + ev.v, 'me'); if (ev.id === (mode === 'offline' ? 0 : V.myId)) { sfx.hurt(); haptic.hit(); shake = .25; const v = $('vig'); v.classList.add('hit'); setTimeout(() => v.classList.remove('hit'), 180); } }
    else if (ev.type === 'out') { sfx.out(); if (ev.id === (mode === 'offline' ? 0 : V.myId)) toast('你倒下了', 1600); }
    else if (ev.type === 'boss') { toast('泡泡王出現！', 2200); sfx.boss(); }
    else if (ev.type === 'ring') shake = Math.max(shake, .08);
    else if (ev.type === 'end') showEnd(ev.result);
  }
}

/* ---------- 單人版 ---------- */
function startOffline() {
  $('startScreen').hidden = $('endScreen').hidden = $('lobbyScreen').hidden = true;
  try { TG?.MainButton?.hide(); } catch {}
  L = Core.createGame({ seed: (Math.random() * 2 ** 32) >>> 0, humans: [{ uid: 'me', name: myName, ...setup }], solo: true });
  buildView(Core.snapshot(L), 0); playing = true; solo = soloStart('survive', ID);
  if (innerHeight > innerWidth * 1.1) toast('橫放手機，視野更寬', 2400);
}
function goOffline(why) {
  mode = 'offline'; try { net.ws?.close(); } catch {} net.ws = null;
  $('lobbyScreen').hidden = true; if (!playing) $('startScreen').hidden = false;
  if (why) toast(why, 2200);
}
$('startBtn').addEventListener('click', () => { mode = 'offline'; startOffline(); });
$('soloBtn').addEventListener('click', () => goOffline());

function showEnd(r) {
  if (!V || V.ended) return; V.ended = true; playing = false; $('choose').hidden = true; $('stick').hidden = true;
  const online = mode === 'online', meId = online ? V.myId : 0, mine = r.players.find(p => p.id === meId);
  $('endTitle').textContent = r.cleared ? (r.reason === 'boss' ? '打倒泡泡王，過關！' : '撐滿 5 分鐘，過關！') : '全員倒下了';
  $('endSub').textContent = online ? (meId == null ? '觀戰結束，下一局一起玩' : `你撐了 ${Math.round(mine?.time ?? 0)} 秒，擊敗 ${mine?.kills ?? 0} 隻`) : `撐了 ${Math.round(mine?.time ?? 0)} 秒，擊敗 ${mine?.kills ?? 0} 隻，等級 ${mine?.level ?? 1}`;
  $('rank').innerHTML = r.players.map(p => `<li><span>${p.rank}. ${esc(p.name)}${p.id === meId ? '（你）' : ''}</span><span>${Math.round(p.time)} 秒・${p.kills} 殺${online ? `・${p.points} 分` : ''}</span></li>`).join('');
  $('againBtn').textContent = online ? '回大廳，再玩一局' : '再玩一局';
  setTimeout(() => { $('endScreen').hidden = false; $('lobbyScreen').hidden = true; }, 900);
  if (r.cleared) { haptic.win(); toast('過關！', 1400); }
  if (online) net.wantIn = false;
  const note = $('endNote'), seq = ++endSeq, s = solo; solo = null; note.hidden = true;
  if (!online && s) showSoloNote(note, soloFinish(s, ID, Math.floor(mine?.time ?? 0), '泡泡倖存者', { field: 'time', extra: { kills: mine?.kills ?? 0 }, show: row => `${row.time} 秒・${row.kills} 殺` }), () => seq !== endSeq);
  if (inTelegram && !online) { try { TG.MainButton.setText('再玩一局'); TG.MainButton.show(); } catch {} }
}
$('againBtn').addEventListener('click', () => {
  if (mode === 'online') { $('endScreen').hidden = true; net.wantIn = true; playing = false; sendJoin(); showLobby(); }
  else startOffline();
});
if (inTelegram) { try { TG.MainButton.onClick(() => { if (mode === 'offline') startOffline(); }); } catch {} }

/* ---------- 連線版（Worker 房間） ---------- */
const net = { ws: null, tries: 0, opened: false, wantIn: true, me: null, lobby: null, lastJoin: 0, lastIn: '', lastInAt: 0,
  send(o) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(o)); } };
const inLobby = () => !!net.lobby?.players.some(p => p.uid === net.me);
const sendJoin = () => net.send({ t: 'join', color: setup.color, ear: setup.ear, eye: setup.eye, body: setup.body, blush: setup.blush });
function connect() {
  const url = WORKER_URL.replace(/\/$/, '').replace(/^http/, 'ws') + '/survive/ws?' + ID.query;
  let ws; try { ws = new WebSocket(url); } catch { return goOffline('連不上遊戲伺服器，先玩單人版'); }
  net.ws = ws;
  ws.onopen = () => { net.tries = 0; net.opened = true; };
  ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch { return; } onNet(m); };
  ws.onclose = e => {
    if (net.ws !== ws || mode !== 'online') return;
    if (e.code === 4000) { lobbyStatus('你在其他視窗開了遊戲，這裡已斷線'); return; }
    if (e.code === 4001) {
      lobbyStatus('閒置超過 10 分鐘，已離開房間。點一下畫面重新加入');
      const back = () => { removeEventListener('keydown', back); removeEventListener('pointerdown', back); net.tries = 0; connect(); };
      addEventListener('keydown', back); addEventListener('pointerdown', back); return;
    }
    net.tries++;
    if (!net.opened && net.tries >= 3) return goOffline('連不上遊戲伺服器，先玩單人版');
    lobbyStatus('連線中斷，重新連線中…'); setTimeout(connect, Math.min(5000, 400 * 2 ** net.tries));
  };
}
function tryJoin() {
  if (!net.wantIn || inLobby() || Date.now() - net.lastJoin < 1500) return;
  const Lb = net.lobby; if (Lb && (Lb.phase === 'play' || Lb.players.length >= Lb.max)) return;
  net.lastJoin = Date.now(); sendJoin();
}
function onNet(m) {
  if (m.t === 'hello') { net.me = m.you; if (m.phase !== 'play') { net.lastJoin = 0; tryJoin(); } }
  else if (m.t === 'lobby') { net.lobby = m; renderLobby(); tryJoin(); }
  else if (m.t === 'start') {
    buildView(m.s, m.me); net1 = m.s; V.newFrame = true; playing = true;
    $('lobbyScreen').hidden = $('endScreen').hidden = $('startScreen').hidden = true;
    toast(m.me == null ? '觀戰中' : '選好武器就開打！', 1400);
  }
  else if (m.t === 's') {
    if (!V) return; net1 = m.s; V.newFrame = true; V.snapAt = performance.now();
    onEvents(m.ev, m.s);
  }
  else if (m.t === 'note') { toast(m.text, 2000); lobbyStatus(m.text); }
}
function showLobby() { if ($('endScreen').hidden && !playing) $('lobbyScreen').hidden = false; renderLobby(); }
function lobbyStatus(t) { $('lobbyStatus').textContent = t; }
function renderLobby() {
  const Lb = net.lobby; if (!Lb) return;
  const slots = [];
  for (let i = 0; i < Lb.max; i++) {
    const p = Lb.players[i];
    slots.push(p ? `<li><span><i style="background:${p.color || '#fff'}"></i>${esc(p.name)}${p.uid === net.me ? '（你）' : ''}</span><span>已加入</span></li>` : `<li class="empty"><span><i></i>空位</span><span>等待玩家</span></li>`);
  }
  $('slots').innerHTML = slots.join('');
  lobbyStatus(Lb.phase === 'play' ? '這局進行中，結束後可加入（可先觀戰）' : Lb.phase === 'end' ? `上一局結算中，${Lb.endIn} 秒後開放新局` : Lb.players.length >= (Lb.min || 2) ? `${Lb.countdown} 秒後開局（滿 4 人立即開始）` : Lb.players.length ? `還差 ${(Lb.min || 2) - Lb.players.length} 人才開局` : `等待玩家加入（至少 ${Lb.min || 2} 人）`);
  const joined = inLobby();
  $('joinBtn').textContent = joined ? '離開' : '加入';
  $('joinBtn').disabled = !joined && (Lb.phase === 'play' || Lb.players.length >= Lb.max);
  if (!playing && $('endScreen').hidden) $('lobbyScreen').hidden = false;
}
$('joinBtn').addEventListener('click', () => {
  if (inLobby()) { net.wantIn = false; net.send({ t: 'leave' }); }
  else { net.wantIn = true; net.lastJoin = 0; tryJoin(); }
});

window.BubbleSurvivors = { start: startOffline, get game() { return L; }, get online() { return mode === 'online'; }, get me() { return V?.myId ?? null; } };

/* ---------- 主迴圈 ---------- */
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  let s = null;
  if (V) {
    if (mode === 'offline' && L) {
      if (playing) { const v = inputVec(); Core.setInput(L, 0, v); const evs = Core.step(L, dt); s = Core.snapshot(L, { full: false }); onEvents(evs, s); } else s = Core.snapshot(L, { full: false });
    } else if (mode === 'online' && net1) {
      s = net1;
      if (playing && V.myId != null) { const v = inputVec(), k = v.x.toFixed(2) + ',' + v.y.toFixed(2), now = performance.now(); if (k !== net.lastIn || now - net.lastInAt > 400) { net.lastIn = k; net.lastInAt = now; net.send({ t: 'in', x: Number(v.x.toFixed(2)), y: Number(v.y.toFixed(2)) }); } }
    }
    updateChains();
    if (s) { sync(s, dt, t); placeCamera(s, dt); hudAt -= dt; if (hudAt <= 0) { hudAt = .1; hud(s); } }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

/* ---------- 外觀與進場 ---------- */
function applyAppearance(a) {
  Object.assign(setup, { color: a.color, ear: a.ear, eye: a.eye, body: a.body, blush: a.blush });
  if (mode === 'online' && inLobby()) sendJoin();
}
async function changeAvatar() { const a = await openAvatarPicker({ initial: setup }); if (a) applyAppearance(a); }
$('avatarBtn').addEventListener('click', changeAvatar); $('lAvatarBtn').addEventListener('click', changeAvatar);
async function goOnline() {
  if (!ID) ID = await openLogin({ soloLabel: '先玩單人版', suggest: myName }); if (!ID) return;
  mode = 'online'; net.tries = 0; net.opened = false; net.wantIn = true;
  $('startScreen').hidden = $('endScreen').hidden = true; $('lobbyScreen').hidden = false; lobbyStatus(ID.guest ? '連線中…（訪客：成績不計入總積分榜）' : '連線中…'); connect();
}
$('onlineBtn').addEventListener('click', goOnline);

{ // 開始畫面先擺一片空場地當背景
  const demo = Core.createGame({ seed: 20261022, humans: [{ uid: 'me', name: myName }], solo: true });
  L = demo; buildView(Core.snapshot(demo), 0); playing = false; $('hudbot').hidden = true; $('team').hidden = true;
}
(async () => {
  const want = new URLSearchParams(location.search).get('mode');
  if (loginErr) toast(LOGIN_ERRORS[loginErr] || `登入失敗（${loginErr}）`, 2600);
  if (!ID && !inTelegram) ID = await openLogin({ required: true, title: '歡迎！選擇身分', soloLabel: '先玩單人版' });
  const a = await loadAppearance() || await openAvatarPicker({ required: true, title: '先選你的小傢伙', note: '還沒設定過外觀。選好後會記住，之後可以在遊戲大廳更換。' });
  applyAppearance(a);
  if (want === 'solo') { mode = 'offline'; startOffline(); }
  else if (ID) goOnline();
})();
tick();
</script>
