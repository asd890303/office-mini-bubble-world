  ghostMesh = blockMesh(me.of[V.pick], 0, 0); ghostMesh.traverse(o => { if (o.material && !o.material.transparent) { o.material = o.material.clone(); o.material.transparent = true; o.material.opacity = .6; } }); V.group.add(ghostMesh);
}
addEventListener('pointermove', e => { if (!V || V.pick < 0 || !ghostMesh) return; const p = groundAt(e.clientX, e.clientY); if (!p) return; const me = V.lastSnap.pl[V.myId ?? -1], kind = me?.of?.[V.pick]; if (!kind) return; const b = Core.BLOCKS[kind]; mouseG = { x: Math.round(p.x * 2) / 2, y: Math.round(p.y * 2) / 2 }; ghostMesh.position.set(mouseG.x - b.w / 2 + b.w / 2, mouseG.y + b.h / 2, 0); });
$('scene').addEventListener('pointerdown', e => {
  if (!V || V.pick < 0 || V.lastSnap.phase !== 'place') return; const me = V.lastSnap.pl[V.myId ?? -1]; if (!me?.of) return;
  const p = groundAt(e.clientX, e.clientY); if (!p) return; const x = Math.round(p.x * 2) / 2, y = Math.round(p.y * 2) / 2;
  if (mode === 'offline') Core.place(L, 0, V.pick, x, y); else net.send({ t: 'place', i: V.pick, x, y }); V.placeAt = performance.now(); setTimeout(() => { const m = V?.lastSnap.pl[V.myId ?? -1]; if (m?.of && performance.now() - V.placeAt > 500) toast('這裡放不了，換個位置'); }, 650);
});

/* ---------- 輸入 ---------- */
const keys = new Set(), touch = { l: false, r: false, j: false, a: false };
const KM = { a: 'l', arrowleft: 'l', d: 'r', arrowright: 'r', w: 'j', arrowup: 'j', ' ': 'j', e: 'a', shift: 'a' };
addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (KM[k]) { e.preventDefault(); keys.add(KM[k]); } });
addEventListener('keyup', e => keys.delete(KM[e.key.toLowerCase()]));
addEventListener('blur', () => keys.clear());
for (const [id, k] of [['bL', 'l'], ['bR', 'r'], ['bJump', 'j'], ['bAct', 'a']]) { const el = $(id), on = v => e => { e.preventDefault(); touch[k] = v; el.classList.toggle('on', v); }; el.addEventListener('pointerdown', on(true)); el.addEventListener('pointerup', on(false)); el.addEventListener('pointercancel', on(false)); el.addEventListener('pointerleave', on(false)); }
const inputState = () => { const l = keys.has('l') || touch.l, r = keys.has('r') || touch.r; return { x: (r ? 1 : 0) - (l ? 1 : 0), j: keys.has('j') || touch.j, a: keys.has('a') || touch.a }; };

/* ---------- HUD 與事件 ---------- */
let toastT = 0; function toast(m, ms = 1600) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms); }
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function hud(s) {
  $('lives').textContent = '♥ ' + Math.max(0, s.lives); $('clock').textContent = s.phase === 'place' ? '放置 ' + Math.max(0, Math.ceil(Core.PLACE_TIME - s.t)) : fmt(s.run);
  const L = V.level, me = s.pl[V.myId ?? -1], pos = s.pl.filter(p => !p.gn).map(p => p.x), lead = Math.max(...pos, 0);
  $('progFill').style.width = Math.min(100, lead / L.goal.x * 100) + '%'; $('progDot').style.left = Math.min(100, (me ? me.x : lead) / L.goal.x * 100) + '%'; $('progDot').style.background = Core.COLORS[V.myId ?? 0];
  $('team').querySelectorAll('.tm').forEach(el => { const p = s.pl[+el.dataset.id]; el.classList.toggle('me', +el.dataset.id === V.myId); el.classList.toggle('gone', !!p?.gn); el.textContent = ''; const i = document.createElement('i'); i.style.background = V.info[+el.dataset.id]?.look?.color || Core.COLORS[+el.dataset.id]; el.append(i, (p?.dn ? '✓ ' : p?.d ? '✗ ' : '') + (V.info[+el.dataset.id]?.name || '')); });
  const b = $('banner');
  if (s.phase === 'place') { b.hidden = false; b.innerHTML = me?.of ? '放一個方塊<small>幫隊友，也小心別擋到路</small>' : '等其他人放置…'; if (me?.of) setTimeout(() => { if (b) b.hidden = true; }, 1800); }
  else if (s.phase === 'countdown') { b.hidden = false; b.innerHTML = Math.max(1, Math.ceil(Core.COUNTDOWN - s.t)) + '<small>一起出發！</small>'; } else b.hidden = true;
  renderOffers(s.phase === 'place' ? me : null);
}
function onEvents(evs) {
  for (const e of evs || []) {
    if (e.type === 'die') { if (e.id === V.myId) { haptic.hit(); toast('你倒下了，回到檢查點', 1400); } else toast(`${V.info[e.id]?.name || '隊友'} 倒下了`, 1000); }
    else if (e.type === 'flag') toast('檢查點！', 900);
    else if (e.type === 'life') toast('撿到生命泡泡，+1 條命', 1400);
    else if (e.type === 'done') toast(`${V.info[e.id]?.name || ''} 到終點了`, 1200);
    else if (e.type === 'gone') toast(`${V.info[e.id]?.name || '隊友'} 離開了`, 1600);
    else if (e.type === 'go') toast('出發！', 900);
    else if (e.type === 'grab' && e.id === V.myId) toast('抱起來了，再按一次丟出去', 1200);
    else if (e.type === 'end') showEnd(e.result);
  }
}
function showEnd(r) {
  if (!V || V.ended) return; V.ended = true; V.over = true; $('offers').hidden = true;
  const type = { run: '橫向闖關', rush: '追逐', climb: '攀爬' }[r.type] || r.type, mod = { none: '', ice: '・冰面', dark: '・黑暗' }[r.mod] || '';
  $('endTitle').textContent = r.win ? '全員過關！' : '挑戰失敗';
  $('endSub').textContent = `${type}${mod}・${fmt(r.time)}・剩 ${r.lives} 條命${V.myId == null ? '（觀戰）' : ''}`;
  $('endRes').innerHTML = r.players.map(p => `<li><span>${esc(p.name)}${p.id === V.myId ? '（你）' : ''}${p.gone ? '（離開）' : ''}</span><span>倒下 ${p.deaths} 次・${p.points} 分</span></li>`).join('');
  setTimeout(() => { $('endScreen').hidden = false; }, 900); if (r.win) haptic.win(); net.wantIn = false; $('againBtn').textContent = mode === 'offline' ? '再玩一局' : '回大廳，再玩一局';
}
$('againBtn').addEventListener('click', () => { $('endScreen').hidden = true; if (mode === 'offline') return startOffline(); net.wantIn = true; playing = false; V = null; sendJoin(); showLobby(); });

/* ---------- 連線 ---------- */
let playing = false, mode = 'online', L = null;
const net = { ws: null, tries: 0, opened: false, wantIn: true, me: null, lobby: null, lastJoin: 0, last: '', lastAt: 0, snap: null,
  send(o) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(o)); } };
const inLobby = () => !!net.lobby?.players.some(p => p.uid === net.me);
const sendJoin = () => net.send({ t: 'join', color: setup.color, ear: setup.ear, eye: setup.eye, body: setup.body, blush: setup.blush });
function lobbyStatus(t) { $('lobbyStatus').textContent = t; }
function connect() {
  const url = WORKER_URL.replace(/\/$/, '').replace(/^http/, 'ws') + '/together/ws?' + ID.query;
  let ws; try { ws = new WebSocket(url); } catch { return lobbyStatus('連不上遊戲伺服器，請稍後再試'); }
  net.ws = ws; ws.onopen = () => { net.tries = 0; net.opened = true; };
  ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch { return; } onNet(m); };
  ws.onclose = e => {
    if (net.ws !== ws) return;
    if (e.code === 4000) return lobbyStatus('你在其他視窗開了遊戲，這裡已斷線');
    if (e.code === 4001) { lobbyStatus('閒置超過 10 分鐘，已離開房間。點一下畫面重新加入'); const back = () => { removeEventListener('keydown', back); removeEventListener('pointerdown', back); net.tries = 0; connect(); }; addEventListener('keydown', back); addEventListener('pointerdown', back); return; }
    net.tries++; if (!net.opened && net.tries >= 4) return lobbyStatus('連不上遊戲伺服器，請稍後再試');
    lobbyStatus('連線中斷，重新連線中…'); setTimeout(connect, Math.min(5000, 400 * 2 ** net.tries));
  };
}
function tryJoin() { if (!net.wantIn || inLobby() || Date.now() - net.lastJoin < 1500) return; const Lb = net.lobby; if (Lb && (Lb.phase === 'play' || Lb.players.length >= Lb.max)) return; net.lastJoin = Date.now(); sendJoin(); }
function onNet(m) {
  if (m.t === 'hello') { net.me = m.you; if (m.phase !== 'play') { net.lastJoin = 0; tryJoin(); } }
  else if (m.t === 'lobby') { net.lobby = m; renderLobby(); tryJoin(); }
  else if (m.t === 'start') { buildView(m.s, m.me); V.lastSnap = m.s; net.snap = m.s; V.newFrame = true; playing = true; V.over = false; $('lobbyScreen').hidden = $('endScreen').hidden = true; toast(m.me == null ? '觀戰中' : '先放一個方塊！', 1600); }
  else if (m.t === 's') { if (!V) return; V.lastSnap = m.s; net.snap = m.s; V.newFrame = true; onEvents(m.ev); }
  else if (m.t === 'note') { toast(m.text, 2000); lobbyStatus(m.text); }
}
function showLobby() { if ($('endScreen').hidden && !playing) $('lobbyScreen').hidden = false; renderLobby(); }
function renderLobby() {
  const Lb = net.lobby; if (!Lb) return; const slots = [];
  for (let i = 0; i < Lb.max; i++) { const p = Lb.players[i]; slots.push(p ? `<li><span><i style="background:${p.color || '#fff'}"></i>${esc(p.name)}${p.uid === net.me ? '（你）' : ''}</span><span>已加入</span></li>` : `<li class="empty"><span><i></i>空位</span><span>等待玩家</span></li>`); }
  $('slots').innerHTML = slots.join('');
  lobbyStatus(Lb.phase === 'play' ? '這局進行中，結束後可加入（可先觀戰）' : Lb.phase === 'end' ? `上一局結算中，${Lb.endIn} 秒後開放新局` : Lb.players.length >= (Lb.min || 2) ? `${Lb.countdown} 秒後開局（滿 ${Lb.max} 人立即開始）` : Lb.players.length ? `還差 ${(Lb.min || 2) - Lb.players.length} 人才開局，需要 ${Lb.min || 2} 到 ${Lb.max} 人` : `等待玩家加入（至少 ${Lb.min || 2} 人，這款一定要合作）`);
  const joined = inLobby(); $('joinBtn').textContent = joined ? '離開' : '加入'; $('joinBtn').disabled = !joined && (Lb.phase === 'play' || Lb.players.length >= Lb.max);
  if (!playing && $('endScreen').hidden) $('lobbyScreen').hidden = false;
}
$('joinBtn').addEventListener('click', () => { if (inLobby()) { net.wantIn = false; net.send({ t: 'leave' }); } else { net.wantIn = true; net.lastJoin = 0; tryJoin(); } });
function applyAppearance(a) { Object.assign(setup, { color: a.color, ear: a.ear, eye: a.eye, body: a.body, blush: a.blush }); if (inLobby()) sendJoin(); }
$('avatarBtn').addEventListener('click', async () => { const a = await openAvatarPicker({ initial: setup }); if (a) applyAppearance(a); });

/* ---------- 單人（本機執行，不連線，只出一個人能解的謎題） ---------- */
function startOffline() {
  mode = 'offline'; try { net.ws?.close(); } catch {} net.wantIn = false;
  $('lobbyScreen').hidden = $('endScreen').hidden = true;
  L = Core.createGame({ seed: (Math.random() * 2 ** 32) >>> 0, humans: [{ uid: 'me', name: '你', ...setup }] });
  buildView(Core.snapshot(L), 0); net.snap = Core.snapshot(L, { full: false }); V.lastSnap = net.snap; playing = true; V.over = false; toast('單人模式：先放一個方塊！', 1600);
}
$('soloBtn').addEventListener('click', startOffline);

/* ---------- 主迴圈 ---------- */
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if (V && mode === 'offline' && L) { const st = inputState(); Core.setInput(L, 0, { x: st.x, jump: st.j, act: st.a }); const evs = Core.step(L, dt); net.snap = V.lastSnap = Core.snapshot(L, { full: false }); onEvents(evs); }
  if (V && net.snap) {
    const s = net.snap;
    if (mode === 'online' && playing && V.myId != null && s.phase === 'run') { const st = inputState(), key = `${st.x},${+st.j},${+st.a}`, now = performance.now(); if (key !== net.last || now - net.lastAt > 500) { net.last = key; net.lastAt = now; net.send({ t: 'in', x: st.x, j: st.j, a: st.a }); } }
    sync(s, dt, t); placeCamera(s, dt); hud(s);
  }
  renderer.render(scene, camera); requestAnimationFrame(tick);
}
window.BubbleTogether = { get v() { return V; }, get L() { return L; }, get mode() { return mode; }, net, Core };
(async () => {
  if (loginErr) toast(LOGIN_ERRORS[loginErr] || `登入失敗（${loginErr}）`, 2600);
  if (!ID && !inTelegram) ID = await openLogin({ required: true, title: '歡迎！選擇身分', soloLabel: '' });
  const a = await loadAppearance() || await openAvatarPicker({ required: true, title: '先選你的小傢伙', note: '還沒設定過外觀。選好後會記住，之後可以在遊戲大廳更換。' });
  applyAppearance(a);
  if (new URLSearchParams(location.search).get('mode') === 'solo') return startOffline();
  if (!ID) { lobbyStatus('需要登入才能連線，也可以先玩單人'); } else { lobbyStatus(ID.guest ? '連線中…（訪客：成績不計入總積分榜）' : '連線中…'); connect(); }
})();
tick();
</script>
